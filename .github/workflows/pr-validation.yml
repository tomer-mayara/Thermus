name: Thermus PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  candidate-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.20.0
      - run: npm install --global pnpm@12.10.1
      - run: pnpm install --frozen-lockfile
      - name: Install matching habit-hooks plugins
        run: |
          printf '%s\n' 'habit-hooks-typescript==1.3.1' 'habit-hooks-generic==1.3.1' > "$RUNNER_TEMP/habit-hooks-constraints.txt"
          pipx install 'habit-hooks[typescript]==1.3.1' --pip-args="--constraint $RUNNER_TEMP/habit-hooks-constraints.txt"
      - name: Run the available selected checks
        env:
          THERMUS_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: node script/pr-review/automation-validate.ts
