plugins = ["typescript", "generic"]
transformers = ["snooze"]
files = [
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.jsx",
  "**/*.mjs",
  "**/*.cjs",
  "!**/node_modules/**",
  "!**/dist/**",
  "!coverage/**",
  "!tools/code-review-agents/**",
  "!docs/api-surface/**",
]

[sensors.eslint]
args = ["--config", ".habit-hooks/eslint.config.mjs"]

[sensors.knip]
disabled = true

[sensors.jscpd]
disabled = true
