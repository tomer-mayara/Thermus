plugins = ["typescript", "generic"]
transformers = ["snooze"]
files = [
  "**/*.ts",
  "**/*.tsx",
  "**/*.js",
  "**/*.jsx",
  "**/*.mjs",
  "**/*.cjs",
  "!**/node_modules/**",
  "!**/dist/**",
  "!coverage/**",
  "!tools/code-review-agents/**",
  "!docs/api-surface/**",
]

[sensors.eslint]
args = ["--config", ".habit-hooks/eslint.config.mjs"]

[sensors.knip]
disabled = true

[sensors.jscpd]
disabled = true

# The owner turned the comment check off. Its sensor flags almost every comment, and the comments that stay give a
# reason, a contract, or a test intent.
[smells.non-essential-comment]
disabled = true
