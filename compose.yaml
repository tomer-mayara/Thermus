# The self-hosted evaluation edition: one server container and one data volume.
# README.md#container-installation gives the commands, also the stopped-server workflow for accounts and clients.
name: thermus

services:
  thermus:
    build: .
    init: true
    restart: unless-stopped
    environment:
      # The public address of the server. With http on localhost, its port is the published port below.
      # Another address must use https, through a TLS reverse proxy in front of the published port.
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - thermus-data:/var/lib/thermus
      # The trusted ad rules that the server reads one time when it starts. Make ad-rules.txt next to this file
      # before the first start; README.md#container-installation tells how. Without the file, Compose stops with
      # an error, because it must not make a directory in its place.
      - type: bind
        source: ./ad-rules.txt
        target: /etc/thermus/ad-rules.txt
        read_only: true
        bind:
          create_host_path: false

volumes:
  # The database, the installation identity, the signing keys, and the secrets.
  thermus-data:
