# AST Metrics configuration. The commands script/code-quality/ast-metrics-*.ts and the
# process in AGENTS.md ("Code quality review with ast-metrics") use this file.
# With 0.43.1, config in the analyzed folder can replace config from the
# working folder or --config.
# Keep this root config authoritative: do not add a config under src/.

sources:
  - ./

# A file that matches one of these regular expressions is not analyzed.
exclude:
  - /node_modules/
  # The worktrees of agents.
  - /\.claude/
  # The generated reports.
  - /ast-report/
  # A separate project with its own checks.
  - /tools/code-review-agents/

reports:
  html: ./ast-report

requirements:
  # The rules apply to production code. A test file is long by design. The
  # file goal of 85 in AGENTS.md applies to production files for the same
  # reason; script/code-quality/ast-metrics-delta.ts lists test files without a goal.
  exclude:
    - /test/
  # ast-metrics ignores a violation that .ast-metrics-baseline.yaml lists.
  # Refresh that file with "ast-metrics baseline" when the rules change.
  rules:
    architecture:
      # Checked for each class, not for each file. script/code-quality/ast-metrics-delta.ts
      # checks the file goal.
      min_maintainability: 85
      max_efferent_coupling: 10
      # no_community_cycles is not used: it judges the grouping of the whole
      # repository, not an import cycle, and its baseline entry drifted with
      # every change of script/. The architecture delta shows the cycles of src/.
    volume:
      max_loc: 150
      max_loc_by_method: 30
      max_logical_loc_by_method: 20
    complexity:
      max_cyclomatic: 20
