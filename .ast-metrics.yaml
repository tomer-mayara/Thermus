# AST Metrics configuration. The scripts script/ast-metrics-*.mjs and the
# process in AGENTS.md ("Code quality review with ast-metrics") use this file.
# ast-metrics reads this file from the analyzed folder and ignores --config.

sources:
  - ./

# A file that matches one of these regular expressions is not analyzed.
exclude:
  - /node_modules/
  # The worktrees of agents.
  - /\.claude/
  # The generated reports.
  - /ast-report/
  # A separate project with its own checks.
  - /tools/code-review-agents/

reports:
  html: ./ast-report

requirements:
  # The rules apply to production code. A test file is long by design; the
  # file goal of 85 in AGENTS.md applies to test files too.
  exclude:
    - /test/
  # ast-metrics ignores a violation that .ast-metrics-baseline.yaml lists.
  # Refresh that file with "ast-metrics baseline" when the rules change.
  rules:
    architecture:
      # Checked for each class, not for each file. script/ast-metrics-delta.mjs
      # checks the file goal.
      min_maintainability: 85
      max_efferent_coupling: 10
      no_community_cycles: true
    volume:
      max_loc: 150
      max_loc_by_method: 30
      max_logical_loc_by_method: 20
    complexity:
      max_cyclomatic: 20
