# PR review rules for Thermus.
#
# Status: proposal of 2026-10-20, in manual trial. The command
# script/pr-review/check.ts applies protected_paths, read_paths, scopes,
# public_surface, dependency_graph, size, ratchet.maintainability_index and
# the two goals of ratchet.crap, and it reads the exceptions file of ratchet.
# With --process and --review it also reads the stages of the metrics process
# of required_checks and applies ratchet.review_findings. The other keys wait
# for CI and the later checks. The section "Review route" of AGENTS.md
# governs where it differs from this file. The playbook
# docs/implementation/pr-review-playbook.md explains the routes and the seven
# checks. The checks will read this file. A change to this file is CLARIFICATION_NEEDED.
#
# A scan of the imports in src/**/*.ts on main 304cd24f (PR #200) seeded the
# lists: 138 files, 438 import statements, every relative specifier resolved
# to one file. The check declared the facts of main 6ac961ae (PR #202) on
# 2026-10-21. A date in a comment says when the list last matched the code.
# "to create" marks a path that does not exist yet.

version: 1
status: manual-trial
glob_syntax: "**, * and ? as in minimatch, on the repository path, dot files included; a pattern without a slash matches a root file; no other syntax"
diff_base: the merge base with origin/main, with rename detection

routes:
  # Take the first route whose condition holds. Print every reason.
  order: [ FIX, CLARIFICATION_NEEDED, ARCHITECT_REVIEW_NEEDED, SHIPPED ]
  hold_label: hold # blocks the merge on every route
  approved_label: approved # the owner sets it; CLARIFICATION_NEEDED and ARCHITECT_REVIEW_NEEDED merge only with it
  route_label_prefix: "route:" # the checks set route:<name>
  merge_method: squash
  merge_by: workflow # nothing else merges; SHIPPED needs no label
  clarification_needed_requires_decision_record: architecture/decisions/** # to create; a CLARIFICATION_NEEDED pull request must add or change a file there

scopes:
  production:
    # the metric rules and the production line limit
    - src/**
  executable:
    # used by the calibration stop rule only
    - src/**
    - script/**
    - test/**
    - docker/**
    - migrations/**
    - .habit-hooks/**
  generated:
    # not counted by the size check
    - docs/metrics/**
    - docs/api-surface/** # to create
    - pnpm-lock.yaml
    - .ast-metrics-baseline.yaml

measurement_basis:
  node: 24.20.0
  ast_metrics: 0.43.1
  typescript: 7.0.2 # native build; no compiler API
  # The snapshot command measures the merge base and the candidate with the
  # installed tools, so a pull request that changes a version measures both
  # with the new version.

  # Check 7. A failed command is FIX. None of this runs today: the repository has
  # no .github/workflows, and branch protection needs GitHub Pro or an organization.
  # CI runs the whole suite on every pull request. The selection rules of the
  # test gate policy stay for local runs. The check reads the stages of the
  # metrics process from its --json file: a failed or unavailable stage is FIX,
  # and a goal miss alone is no reason.
required_checks:
  pull_request:
    - pnpm test # the full ordinary suite
    - pnpm run typecheck
    - pnpm run build:user-portal
    - habit-hooks --branch origin/main
    - pnpm exec node script/code-quality/ast-metrics-coverage.ts --suite unit --suite integration --suite acceptance --out ast-report/coverage.json
    - pnpm exec node script/code-quality/ast-metrics-process.ts --coverage ast-report/coverage.json --json ast-report/process.json # writes the stage outcomes also for a goal miss; the check reads them
    - pnpm exec node script/code-quality/ast-metrics-snapshot.ts --base origin/main # writes ast-report/snapshot-base.json
    - pnpm exec node script/code-quality/ast-metrics-snapshot.ts # writes ast-report/snapshot.json
    - pnpm exec node script/code-quality/ast-metrics-crap.ts --base origin/main --coverage ast-report/coverage.json --json ast-report/crap.json # writes the rows also for a goal miss; its exit status 1 for a goal is no failure, because the check applies the goals
    - pnpm exec node script/pr-review/check.ts --base origin/main --repo tomer-mayara/Thermus --base-snapshot ast-report/snapshot-base.json --head-snapshot ast-report/snapshot.json --crap ast-report/crap.json --process ast-report/process.json --review ast-report/review.json # checks 1, 3 and 5, the MI rules and CRAP goals of check 4, the metrics step, and the modules of check 2
  when_paths_change:
    - paths: [ src/**, docker/**, "Dockerfile*" ]
      commands: [ pnpm run build:hosted, pnpm run test:container:hosted ] # the AMD64 runner replaces the emulated local build
    - paths:
        - src/pipelines/providers/website-fetcher/**
        - src/pipelines/page-fetch/**
      commands: [ pnpm run test:mcp:renderer ] # needs the Lightpanda runtime on the runner
  live_gates: docs/implementation/test-gate-policy.md # the hosted live gate stays manual
  main_push:
    - the same commands as pull_request
    - audit: recompute the route of the merged pull request; open an issue when the route was CLARIFICATION_NEEDED or ARCHITECT_REVIEW_NEEDED and the approved label was absent

# Check 1. A changed path that matches a pattern is CLARIFICATION_NEEDED. A path can appear in
# more than one group. The lists matched the tree on 2026-10-21.
protected_paths:
  policy:
    route: CLARIFICATION_NEEDED
    question: "Does this change what the checks enforce, or who decides? Record the new rule and why."
    paths:
      - AGENTS.md
      - CLAUDE.md
      - docs/implementation/component-registry-workflow.md
      - .github/**
      - docs/implementation/pr-review-playbook.md
      - docs/implementation/pr-review-rules.yaml
      - docs/api-surface/**
      - docs/reference/**
      - test/acceptance/architecture/**
      - script/pr-review/**
      - script/code-quality/review/**
      - .habit-hooks/**
      - .ast-metrics.yaml
      - script/component-ownership.ts
  contracts:
    route: CLARIFICATION_NEEDED
    question: "Does a client, a user or an operator see a different input, output, error or default? Record the promise."
    paths:
      - src/index.ts
      - src/interfaces/mcp/fetch-tool-schema.ts
  dependencies_and_build:
    route: CLARIFICATION_NEEDED
    question: "Which new code runs in production or in the build, and who maintains it? Record the reason for the dependency."
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - patches/**
      - tsconfig*.json
      - .npmrc
      - .nvmrc
      - .gitmodules
  deploy_and_data:
    route: CLARIFICATION_NEEDED
    question: "What changes in the image, the runtime, or the stored data, and how is it rolled back? Record the recovery step."
    paths:
      - Dockerfile*
      - .dockerignore
      - compose.yaml
      - docker/**
      - migrations/**
      - .env.example
  security:
    route: CLARIFICATION_NEEDED
    question: "Does this change admission, trust, permissions, or what untrusted content can reach? Record the guarantee that holds after the change."
    paths:
      - src/accounts/identity/**
      - src/accounts/providers/**
      - src/accounts/billing/**
      - src/accounts/organizations/**
      - src/runtime/config/**
      - src/interfaces/web/**
      - src/interfaces/cli/**
      - src/app/hosted-portal.ts
      - src/app/hosted-renderer-startup.ts
      - src/app/application.ts
      - src/app/hidden-line-input.ts
      - src/interfaces/user-portal/portal.ts
      - src/interfaces/mcp/mcp-server.ts
      - src/interfaces/mcp/identity-verifier-sdk-adapter.ts
      - src/interfaces/mcp/protected-resource-endpoint.ts
      - src/pipelines/page-fetch/fetch-page.ts
      - src/pipelines/html-processing/prompt-injection-remover/**
      - src/pipelines/html-processing/html-to-markdown/sanitize-html-document.ts
      - src/pipelines/html-processing/html-to-markdown/plain-text-input.ts
      - src/pipelines/html-processing/html-input-limit.ts
      - src/pipelines/html-processing/ad-cleaner/html-depth-limit-error.ts
      - src/runtime/http/server.ts
      - src/runtime/http/fetch-exchange.ts
      - src/runtime/http/client-address.ts
      - src/pipelines/providers/website-fetcher/network-policy.ts
      - src/pipelines/providers/website-fetcher/fetch-diagnostic.ts
      - src/pipelines/providers/website-fetcher/website-fetcher-lightpanda.ts
      - src/pipelines/providers/search-engine/search-engine-brave-http.ts
  # Three busy files carry one security concern each: fetch-page.ts, the
  # lightpanda fetcher and the Brave engine. Moving the concern into a small
  # file of its own shrinks the protected set to that file.

  # A change to one of these paths is ARCHITECT_REVIEW_NEEDED.
read_paths:
  route: ARCHITECT_REVIEW_NEEDED
  paths:
    - .ast-metrics-baseline.yaml # the accepted native lint violations
    - .code-quality-exceptions.yaml # optional; the metric exceptions of check 4
    - docs/implementation/test-gate-policy.md # while no CI exists, this document is the enforcement; move it out when workflows run the checks
    - docs/implementation/ast-metrics-review.md # same reason
    - .agent/** # agent configuration
  moved_by_stop_rule: [] # executable files of reverted SHIPPED pull requests; the owner removes them after the fix

# Check 2. CI emits a declaration file for each module below and compares it
# with the committed copy under snapshot_dir. The emitted file includes the
# declarations of the same-package files that the module re-exports or imports
# types from, so a changed shape behind a re-export shows. A change under
# contract_documents is CLARIFICATION_NEEDED through protected_paths.
# Proof of 2026-10-20: tsc 7.0.2 with declaration and emitDeclarationOnly wrote
# src/auth/access-context.d.ts in 0.12 s. A module with relative imports is not
# tested yet.
public_surface:
  snapshot_dir: docs/api-surface # to create
  contract_documents: docs/reference/**
  undeclared_difference: FIX # the pull request has not committed the new snapshot
  declared_change: CLARIFICATION_NEEDED # the snapshot folder is a protected path
  external:
    - src/index.ts
    - src/interfaces/mcp/fetch-tool-schema.ts
    - src/interfaces/mcp/protected-resource-endpoint.ts
    - src/pipelines/search/search-query.ts
    - src/pipelines/providers/search-engine/search-engine.ts
    - src/runtime/config/deployment-config.ts
    - src/runtime/config/ad-rules-file.ts
  between_packages:
    identity:
      - src/accounts/identity/access-context.ts
      - src/accounts/identity/browser-session.ts
      - src/accounts/identity/identity-verifier.ts
      - src/accounts/identity/local-user-administration.ts
    billing:
      - src/accounts/billing/billing.ts
    web:
      - src/interfaces/web/account/account-form.ts
      - src/interfaces/web/html-escape.ts
      - src/interfaces/web/page-html.ts
    http:
      - src/runtime/http/client-address.ts
      - src/runtime/http/request-cancellation.ts
    organizations:
      - src/accounts/organizations/administration-overviews.ts
      - src/accounts/organizations/change-records.ts
      - src/accounts/organizations/customer-roles.ts
      - src/accounts/organizations/organization-administration.ts
      - src/accounts/organizations/organization-directory.ts
    page-fetch:
      - src/pipelines/page-fetch/fetch-failure.ts
      - src/pipelines/page-fetch/fetch-page.ts
      - src/pipelines/page-fetch/fetch-url.ts
    execution:
      - src/pipelines/execution/execution-context.ts
      - src/pipelines/execution/pipeline-step.ts
      - src/pipelines/execution/step-record.ts
    website-fetcher:
      - src/pipelines/providers/website-fetcher/renderer-failure-reports.ts
      - src/pipelines/providers/website-fetcher/website-fetcher.ts
    search:
      - src/pipelines/search/search-failure.ts
      - src/pipelines/search/search-pipeline.ts
    workos:
      - src/accounts/providers/workos/session-cookies.ts
      - src/accounts/providers/workos/workos-browser-session.ts
      - src/accounts/providers/workos/workos-signup-documents.ts
      - src/accounts/providers/workos/workos-signup.ts
  documented:
    - src/app/fetch-tool.ts
    - src/pipelines/html-processing/html-to-markdown-pipeline.ts
    - src/pipelines/html-processing/ad-cleaner/adb/clean-html-ads-adblock-rs.ts
    - src/pipelines/html-processing/ad-cleaner/html-depth-limit-error.ts
    - src/pipelines/providers/website-fetcher/network-policy.ts
  # A file that only app imports is wiring, not a contract, and has no
  # snapshot.

  # Check 3. CI builds the package graph of src/ from the imports with relative
  # specifiers and from the external imports. Each trigger below names its route.
dependency_graph:
  counting:
    forms: [ static import, export from, side-effect import, dynamic import, import type ]
    type_only: "import type ... or export type ... from. An import whose specifiers all carry an inline type keyword is runtime: with verbatimModuleSyntax, TypeScript emits import {} from the module, which loads it."
    subpath: "better-auth/oauth2 counts as better-auth"
    unresolved_relative_import: FIX
  triggers:
    edge_not_listed: FIX # until the pull request lists it; the listing is CLARIFICATION_NEEDED through protected_paths
    type_edge_becomes_runtime: FIX # the same as a new edge
    runtime_edge_becomes_type: none # the kind is a maximum; a weaker use needs no change
    folder_not_listed: FIX # an undeclared component; all source files need one root or exact-file owner
    package_removed: FIX # until the list changes
    cycle_not_listed: FIX
    known_cycle_grows: FIX # a new package edge among its members, or a new member
    cross_package_file_not_in_public_surface: FIX # a component other than app imports a file that public_surface does not list
    external_import_not_listed: FIX # an npm package or a Node builtin that the package does not list
    forbidden_edge: FIX # no listing can allow it
  allowed_edges:
    - { from: app, to: better-auth, kind: runtime }
    - { from: app, to: billing, kind: runtime }
    - { from: app, to: cli, kind: runtime }
    - { from: app, to: config, kind: runtime }
    - { from: app, to: execution, kind: runtime }
    - { from: app, to: html-processing, kind: runtime }
    - { from: app, to: http, kind: runtime }
    - { from: app, to: logging, kind: runtime }
    - { from: app, to: mcp, kind: runtime }
    - { from: app, to: organizations, kind: runtime }
    - { from: app, to: page-fetch, kind: runtime }
    - { from: app, to: search, kind: runtime }
    - { from: app, to: search-engine, kind: runtime }
    - { from: app, to: web, kind: runtime }
    - { from: app, to: website-fetcher, kind: runtime }
    - { from: app, to: workos, kind: runtime }
    - { from: app, to: identity, kind: type }
    - { from: organizations, to: identity, kind: type }
    - { from: organizations, to: billing, kind: type }
    - { from: workos, to: identity, kind: runtime }
    - { from: workos, to: organizations, kind: runtime }
    - { from: workos, to: billing, kind: type }
    - { from: better-auth, to: identity, kind: runtime }
    - { from: better-auth, to: http, kind: runtime }
    - { from: mcp, to: identity, kind: runtime }
    - { from: mcp, to: http, kind: runtime }
    - { from: mcp, to: page-fetch, kind: runtime }
    - { from: mcp, to: search, kind: runtime }
    - { from: mcp, to: execution, kind: type }
    - { from: web, to: identity, kind: runtime }
    - { from: web, to: http, kind: runtime }
    - { from: web, to: workos, kind: runtime }
    - { from: web, to: organizations, kind: type }
    - { from: web, to: billing, kind: type }
    - { from: cli, to: config, kind: runtime }
    - { from: cli, to: identity, kind: type }
    - { from: execution, to: website-fetcher, kind: type }
    - { from: page-fetch, to: identity, kind: runtime }
    - { from: page-fetch, to: execution, kind: runtime }
    - { from: page-fetch, to: website-fetcher, kind: runtime }
    - { from: search, to: identity, kind: runtime }
    - { from: search, to: execution, kind: runtime }
    - { from: search, to: website-fetcher, kind: runtime }
    - { from: search, to: search-engine, kind: type }
    - { from: html-processing, to: execution, kind: type }
    - { from: html-processing, to: website-fetcher, kind: type }
    - { from: search-engine, to: website-fetcher, kind: type }
    - { from: http, to: config, kind: type }
    # 48 permitted owner edges on 2026-10-21; runtime includes public types.
  forbidden_edges:
    - { from: html-processing, to: [ mcp ] }
    - { from: website-fetcher, to: [ identity, workos, better-auth, web, cli ] }
    - { from: identity, to: mcp }
    - { from: workos, to: mcp }
    - { from: better-auth, to: mcp }
    - { from: web, to: mcp }
    - { from: cli, to: mcp }
    - { from: page-fetch, to: [ mcp, http, web, app, html-processing, logging ] }
    - { from: identity, to: app }
    - { from: organizations, to: app }
    - { from: billing, to: app }
    - { from: workos, to: app }
    - { from: better-auth, to: app }
    - { from: mcp, to: app }
    - { from: web, to: app }
    - { from: cli, to: app }
    - { from: user-portal, to: app }
    - { from: execution, to: app }
    - { from: page-fetch, to: app }
    - { from: search, to: app }
    - { from: html-processing, to: app }
    - { from: website-fetcher, to: app }
    - { from: search-engine, to: app }
    - { from: logging, to: app }
    - { from: http, to: app }
    - { from: config, to: app }
  file_guards: keep # the eslint import rules in .habit-hooks and test/acceptance/architecture stay; at adoption they read this file
  known_cycles: []
  allowed_external_imports:
    # Observed per component on 2026-10-21; no inherited parent allowances.
    workos: [ "@workos-inc/node", jose ]
    web: [ linkedom, micromark, micromark-extension-gfm ]
    better-auth: [ "@better-auth/mcp", better-auth ]
    config: [ "@modelcontextprotocol/server" ]
    app: [ "@workos-inc/node", jose, linkedom ]
    html-processing: [ adblock-rs, agent-input-sanitizer, css-select, css-tree, defuddle, htmlparser2, linkedom, parse5, parse5-htmlparser2-tree-adapter ]
    logging: [ "@opentelemetry/api-logs" ]
    mcp: [ "@modelcontextprotocol/server" ]
    search-engine: [ css-select, htmlparser2 ]
    user-portal: [ vite ]
  allowed_node_builtins:
    # Observed per component on 2026-10-21; no inherited parent allowances.
    workos: [ node:crypto ]
    web: [ node:crypto ]
    better-auth: [ node:crypto, node:fs, node:path, node:sqlite ]
    cli: [ node:util ]
    config: [ node:fs, node:path ]
    app: [ node:child_process, node:fs/promises, node:path, node:readline, node:stream, node:url ]
    html-processing: [ node:crypto ]
    http: [ node:events, node:http, node:net ]
    logging: [ node:path, node:stream, node:url ]
    mcp: [ node:crypto ]
    page-fetch: [ node:os ]
    search: [ node:os ]
    user-portal: [ node:url ]
    website-fetcher: [ node:child_process, node:dns, node:dns/promises, node:net, node:os ]
  components:
    # Stable IDs and exact source roots. Grouping folders are not owners.
    app: { roots: [ src/app/ ], files: [ src/index.ts ] }
    identity: { roots: [ src/accounts/identity/ ] }
    organizations: { roots: [ src/accounts/organizations/ ] }
    billing: { roots: [ src/accounts/billing/ ] }
    workos: { roots: [ src/accounts/providers/workos/ ] }
    better-auth: { roots: [ src/accounts/providers/better-auth/ ] }
    mcp: { roots: [ src/interfaces/mcp/ ] }
    web: { roots: [ src/interfaces/web/ ] }
    cli: { roots: [ src/interfaces/cli/ ] }
    user-portal: { roots: [ src/interfaces/user-portal/ ] }
    execution: { roots: [ src/pipelines/execution/ ] }
    page-fetch: { roots: [ src/pipelines/page-fetch/ ] }
    search: { roots: [ src/pipelines/search/ ] }
    html-processing: { roots: [ src/pipelines/html-processing/ ] }
    website-fetcher: { roots: [ src/pipelines/providers/website-fetcher/ ] }
    search-engine: { roots: [ src/pipelines/providers/search-engine/ ] }
    logging: { roots: [ src/logging/ ] }
    http: { roots: [ src/runtime/http/ ] }
    config: { roots: [ src/runtime/config/ ] }

# Check 4. The author takes two snapshots with
# script/code-quality/ast-metrics-snapshot.ts, one of the merge base and one
# of the candidate. The check reads them with --base-snapshot and
# --head-snapshot and applies maintainability_index to the raw MI of each
# changed production file. After the metrics process, the author writes the
# CRAP rows of the candidate with script/code-quality/ast-metrics-crap.ts
# --json. The check reads them with --crap and applies the two goals of crap
# to the new, unknown and changed functions of the changed production files.
# A snapshot or a CRAP file of another commit stops the check. The check reads
# the exceptions file at HEAD; today is the committer date of HEAD, so that a
# rerun gives the same route. With --review, the check reads the findings of
# the review stage of the metrics process. A metrics file of another commit
# stops the check. The other CRAP keys and identity wait for the later checks.
ratchet:
  base_snapshot: ast-report/snapshot-base.json # the default output of the snapshot command with --base
  head_snapshot: ast-report/snapshot.json # the default output of the snapshot command without --base
  process_outcomes: ast-report/process.json # the default location of the JSON of ast-metrics-process.ts --json; the check reads it with --process; a failed or unavailable stage is FIX
  review_findings: ast-report/review.json # the JSON that the review stage of the metrics process writes; the check reads it with --review after a completed Review stage; a high finding on a changed production file is ARCHITECT_REVIEW_NEEDED, a finding on an unchanged file keeps the reason "unchanged by this PR"
  coverage_suites: [ unit, integration, acceptance ] # one basis for the AGENTS.md report and this check; the metrics guide uses unit only today
  identity:
    key: the function identity and move detection of script/code-quality/ast-metrics-crap.ts
    new_function: a function with no score at the merge base
    legacy_function: a function with a score at start_commit
    start_commit: null # set at adoption; until then the check treats each changed function as legacy
    unknown_coverage_on_changed_function: FIX # a bound can prove the goal first: p paths without a share give CRAP from p to p² + p
  crap:
    unit: function
    rows: ast-report/crap.json # the default location of the JSON of ast-metrics-crap.ts --json; the check reads it with --crap
    new_function_above: 15 # FIX for a new function or one of unknown identity; the check supports 15 only
    changed_legacy_function_at_or_above: 30 # FIX for a changed function; the check supports 30 only
    changed_function_above_goal_and_worse_than_base: later # a later iteration, after the base is measured; the check ignores this key
  maintainability_index:
    unit: production file # a test or support file has no rule
    new_file_below: 85 # FIX for a new file (status A) below this raw MI
    existing_file_drop_read_at: 5 # ARCHITECT_REVIEW_NEEDED at a raw drop of five or more from the base snapshot; a renamed file continues its old path
    compare: raw values, no rounding
  exceptions:
    file: .code-quality-exceptions.yaml # optional; a change is ARCHITECT_REVIEW_NEEDED through read_paths
    fields: [ unit, metric, bound, reason, expires, predecessor ] # the check reads path (the unit of mi) or function (<file>#<function>, the unit of crap), metric, bound, reason and expires (YYYY-MM-DD)
    predecessor: the function that a renamed or moved function continues, so it keeps the legacy goal
    expired_entry: FIX for a pull request that changes the unit; other expiries go to the monthly review # the check takes a change of the file of a function as a change of its unit

# Check 5. Lines are additions plus deletions in the diff against the merge base.
size:
  production_lines_read_above: 400 # under scopes.production
  total_lines_read_above: 1500 # all files minus scopes.generated
  test_counts:
    source: the summary of the Node test reporter, recorded per main commit
    fewer_tests_than_base: ARCHITECT_REVIEW_NEEDED
    more_skipped_or_todo_than_base: ARCHITECT_REVIEW_NEEDED
  habit_hooks_snooze_non_empty: FIX # .habit-hooks/snooze.json stays []
  # Reference: pull requests #186 to #200 merged on 2026-10-19 and 2026-10-20.
  # 6 of the 15 changed src/. The largest changed 450 src lines in 8 files.
  # docs/metrics added 187 to 1,468 lines per pull request, so scopes.generated matters.

  # Check 6. A green pull request is SHIPPED when no other check gives a reason.

calibration:
  review_every: month
  targets:
    human_before_merge_share_max: 0.30 # CLARIFICATION_NEEDED plus ARCHITECT_REVIEW_NEEDED over all merged pull requests
    false_alarm_share_max: 0.20 # CLARIFICATION_NEEDED or ARCHITECT_REVIEW_NEEDED pull requests with no commit after the route label
  stop_rule:
    shipped_reverts_per_month: 2 # count reverted SHIPPED pull requests that changed scopes.executable; then their executable files go to read_paths.moved_by_stop_rule
    revert: a merge whose message says "This reverts commit"
